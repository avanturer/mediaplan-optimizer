# Реестр констант мозга: планировщик, оценщик, детектор, контроллер.
#
# ПРАВИЛО ПРОЕКТА: ни одного числа из головы. У каждой константы либо
# публичный источник (status: sourced, source_url), либо пометка
# status: calibrated со ссылкой на тест, который её проверяет.
# tests/test_provenance.py падает, если у константы нет происхождения.

meta:
  version: "0.1.0"

planner:
  allocation_steps:
    value: 1000
    status: calibrated
    test: "tests/test_planner.py::test_allocation_stable_under_finer_steps"
    note: "порций наливания; при удвоении план меняется менее чем на 1 %"
  model_grid_size:
    value: 160
    status: calibrated
    test: "tests/test_planner.py::test_allocation_stable_under_finer_steps"
    note: "точек сетки функции «бюджет → результат» канала"
  type_b_bisection_steps:
    value: 300
    status: numerical
    note: "порций жадного наливания внутри бисекции по бюджету (тип B и диагноз): грубее основной сетки ради скорости, результат проверяется test_allocation_stable_under_finer_steps"
  budget_bisection_iterations:
    value: 40
    status: numerical
    note: "итераций бисекции минимального бюджета под цель: точность бюджета 2^-40 от ёмкости"
  max_horizon_days:
    value: 90
    status: sourced
    source_url: "contracts/brief.py"
    note: "верхняя граница горизонта брифа из контракта (Field le=90); диагноз недостижимости ищет срок до неё"
  reachable_target_margin:
    value: 0.95
    status: calibrated
    test: "tests/test_planner.py::test_type_b_diagnoses_binding_constraint"
    note: "ход «снизить цель» предлагает 95 % достижимого максимума, чтобы цель не висела ровно на потолке ёмкости"
  corridor_sigma_divisor:
    value: 1.2816
    status: sourced
    source_url: "https://en.wikipedia.org/wiki/Standard_normal_table"
    note: "диапазон каталога трактуем как P10–P90; z(0.90) = 1.2816, коридор ±1σ"

curves:
  saturation_tolerance:
    value: 0.97
    status: calibrated
    test: "tests/test_curves.py::test_curve_saturates_where_cap_stops_binding"
    note: "расход ниже 97 % лимита = лимит не связывал, дальше потолок"
  prior_impressions:
    value: 20000
    status: calibrated
    test: "tests/test_curves.py::test_rates_are_prior_smoothed"
    note: "вес приора CTR в показах: около одного дня трафика среднего канала"
  prior_clicks:
    value: 200
    status: calibrated
    test: "tests/test_curves.py::test_rates_are_prior_smoothed"
    note: "вес приора CVR в кликах; практика Директа: автостратегия не учится при < 10 конверсий в неделю (https://habr.com/ru/articles/1061240/)"

retro:
  levels:
    value: [0.01, 0.03, 0.08, 0.15, 0.3, 0.6, 1.2]
    status: calibrated
    test: "tests/test_curves.py::test_curve_saturates_where_cap_stops_binding"
    note: "лестница дневных лимитов как доли верхней оценки расхода канала; верхние уровни заведомо выше потолка"
  sms_capacity_multiplier:
    value: 1.5
    status: calibrated
    test: "tests/test_curves.py::test_curve_saturates_where_cap_stops_binding"
    note: "верхняя оценка дневного расхода SMS для лестницы лимитов: база / период охлаждения × цена × 1,5, чтобы верхние уровни заведомо превышали потолок"
  ladder_start_share:
    value: 0.15
    status: calibrated
    test: "tests/test_curves.py::test_curve_saturates_where_cap_stops_binding"
    note: "первый уровень лестницы как доля верхней оценки дневного расхода канала"
  episode_budget_margin:
    value: 1.01
    status: numerical
    note: "общий бюджет ретро-эпизода на 1 % выше суммы лимитов, чтобы общий бюджет не связывал раньше лимитов каналов"
  world_seeds:
    value: [1001, 1002, 1003]
    status: calibrated
    test: "tests/test_isolation.py::test_plan_independent_of_world_seed"
    note: "три прошлые кампании; их зёрна не пересекаются с зёрнами оцениваемых кампаний"
  public_contacts_per_user:
    value: 3.0
    status: calibrated
    test: "tests/test_world_behaviour.py::test_demo_plan_buys_about_half_of_inventory"
    note: "публичная оценка контактов на уникума в сутки для верхней границы лестницы (config/assumptions.yaml, contacts_per_user_per_day)"

detector:
  window_hours:
    value: 24
    status: sourced
    source_url: "https://improvado.io/blog/campaign-monitoring-and-anomaly-detection"
    note: "практика мониторинга: сравнение «сегодня против недавних дней»; сутки гасят суточный профиль"
  baseline_hours:
    value: 72
    status: calibrated
    test: "tests/test_executor.py::test_detector_silent_without_shock"
    note: "база из предыдущих трёх суток: достаточно кликов и ещё не ушла усталость"
  drop_threshold:
    value: 0.30
    status: sourced
    source_url: "https://improvado.io/blog/campaign-monitoring-and-anomaly-detection"
    note: "падение CTR на 30–40 % считается аномалией и предвестником роста CPA; берём нижнюю границу"
  min_clicks:
    value: 100
    status: calibrated
    test: "tests/test_executor.py::test_detector_silent_without_shock"
    note: "пуассоновский разброс суточной отдачи при 100 кликах около 10 %, порог 30 % это 3σ"
  confirm_hours:
    value: 12
    status: calibrated
    test: "tests/test_executor.py::test_detector_silent_without_shock"
    note: "падение должно держаться полсуток подряд, иначе один неудачный час или день считается шумом"
  shock_status_hours:
    value: 24
    status: calibrated
    test: "tests/test_executor.py::test_detector_catches_ctr_drop"
    note: "сколько часов после срабатывания канал считается «в пожаре»; потом новый режим принят как норма"
  rise_threshold:
    value: 0.30
    status: sourced
    source_url: "https://improvado.io/blog/campaign-monitoring-and-anomaly-detection"
    note: "скачок CTR (клики на показ) на 30 % и значимый на 3σ: аномалия в обе стороны; держатель кейса на чекпоинте 04.09 предложил тот же порог для роста CTR как признака фрода"
  kpi_window_hours:
    value: 72
    status: calibrated
    test: "tests/test_executor.py::test_kpi_detector_catches_cvr_drop"
    note: "детектор по конверсиям на рубль: при ~13 конверсиях в сутки на канал трое суток дают ~40 событий, пуассоновский разброс ~16 %, порог 30 % это около 2σ"
  kpi_baseline_hours:
    value: 120
    status: calibrated
    test: "tests/test_executor.py::test_detector_silent_without_shock"
    note: "база пять суток: достаточно конверсий и ещё не ушла усталость; первое возможное срабатывание на восьмые сутки"
  z_threshold:
    value: 3.0
    status: sourced
    source_url: "https://en.wikipedia.org/wiki/68%E2%80%9395%E2%80%9399.7_rule"
    note: "оба детектора: падение или рост засчитываются, если доля событий окна значимо отличается от ожидаемой на 3σ (условный биномиальный тест двух пуассоновских счётчиков); порог в процентах задаёт величину эффекта, тест значимости отсекает шум, поэтому детектор сам подстраивается под волатильность мира"
  min_expected_events:
    value: 10
    status: sourced
    source_url: "https://en.wikipedia.org/wiki/Binomial_distribution#Normal_approximation"
    note: "нормальное приближение биномиального теста допустимо при np ≥ 10 и n(1−p) ≥ 10 с каждой стороны; ниже детектор молчит"
  kpi_confirm_hours:
    value: 24
    status: calibrated
    test: "tests/test_executor.py::test_detector_silent_without_shock"
    note: "падение отдачи по конверсиям должно держаться сутки: событий мало, подтверждение длиннее, чем по кликам"

  ecpm_ewma_alpha:
    value: 0.2
    status: sourced
    source_url: "https://www.itl.nist.gov/div898/handbook/pmc/section3/pmc324.htm"
    note: "EWMA цены за тысячу показов; NIST/SEMATECH 6.3.2.4: λ от 0,2 до 0,3 по Hunter (1986)"
controller:
  dead_zone:
    value: 0.03
    status: calibrated
    test: "tests/test_executor.py::test_adaptive_beats_static_without_shock"
    note: "мёртвая зона ошибки темпа; форма из arXiv:2509.25429 (допуск ε), значение калибруется"
  error_bands:
    value: [[0.03, 0.05], [0.10, 0.10], [0.25, 0.20]]
    status: calibrated
    test: "tests/test_executor.py::test_adaptive_beats_static_without_shock"
    note: "банды |E| → шаг множителя; средний шаг 10 % совпадает с правилом LinkedIn ×1.1/×0.9 (KDD'14)"
  lambda_bounds:
    value: [0.2, 5.0]
    status: calibrated
    test: "tests/test_executor.py::test_adaptive_beats_static_without_shock"
    note: "anti-windup множителя темпа; ориентир: диапазон корректировок ставок площадок от −90 % до +300 %"
  replan_every_hours:
    value: 6
    status: calibrated
    test: "tests/test_executor.py::test_full_run_is_fast"
    note: "перерешение раз в 6 часов и по событию: компромисс скорости и качества"
  replan_warmup_hours:
    value: 24
    status: calibrated
    test: "tests/test_executor.py::test_no_scheduled_replan_in_first_day"
    note: "первые сутки исполнитель воспроизводит утверждённый план: шести ночных часов мало, чтобы переоптимизировать по приору (ревью 06.09: перенос 62 тыс. ₽ в SMS ночью и разворот через сутки); перерешение по событию (детектор, пауза) разрешено и в первые сутки; сутки как ритм лимита доли"
  case_threshold:
    value: 0.20
    status: calibrated
    test: "tests/test_executor.py::test_status_follows_case_threshold"
    note: "порог приёмки кейса: отклонение в конце не более 20 %. Статус «пожар» с порога или при активном детекторе, «наблюдаем» с половины порога; раньше полоса статуса равнялась коридору ±35 % и −25 % по KPI показывалось как «в норме»"
  reserve_elasticity:
    value: 1.0
    status: calibrated
    test: "tests/test_executor.py::test_reserve_accounts_for_concavity"
    note: "эластичность KPI остатка по расходу в уравнении резерва. Модельная оценка по жадному распределению даёт 0,2–0,4 из-за плоских участков огибающей у потолка и завышает резерв; фактическая граница на стенде (мир 2: −43 % расхода против −36 п.п. KPI) близка к линейной, поэтому 1,0"
  reserve_bisection_steps:
    value: 20
    status: calibrated
    test: "tests/test_executor.py::test_reserve_accounts_for_concavity"
    note: "итераций бисекции доли резерва по уравнению r(1 − s)^e = 1 + s; численное разрешение 1e-6, на результат не влияет"
  pool_floor_share:
    value: 0.1
    status: calibrated
    test: "tests/test_executor.py::test_adaptive_beats_static_without_shock"
    note: "пул новых уникальных при перерешении не меньше 10 % полного пула: иначе канал с почти выбранным охватом получает нулевую отдачу и выпадает из распределения"
  share_floor:
    value: 0.01
    status: numerical
    note: "к верхней границе доли добавляется 1 %, чтобы канал с нулевой долей на начало суток мог получить деньги (иначе лимит ±30 % от нуля равен нулю)"
  share_rate_limit:
    value: 0.30
    status: sourced
    source_url: "https://developers.google.com/meridian/docs/user-guide/budget-optimization-scenarios"
    note: "Meridian: spend_constraint_lower/upper по умолчанию ±30 % от текущей доли канала; у нас за сутки (доля на начало суток), а не за каждое перерешение"
  pause_after_hours:
    value: 3
    status: calibrated
    test: "tests/test_executor.py::test_paused_channel_is_evacuated"
    note: "часов без показов при ненулевом лимите, после которых канал считаем недоступным"
  probe_share:
    value: 0.10
    status: sourced
    source_url: "http://www0.cs.ucl.ac.uk/staff/w.zhang/rtb-papers/linkedin-pacing.pdf"
    note: "LinkedIn: медленный старт с 10 % от полного темпа; тем же щупаем недоступный канал"
  proposal_min_share:
    value: 0.05
    status: calibrated
    test: "tests/test_executor.py::test_paused_channel_is_evacuated"
    note: "ход меньше 5 % остатка в карточку не попадает: шум, а не решение"
  replan_grid_size:
    value: 48
    status: calibrated
    test: "tests/test_executor.py::test_full_run_is_fast"
  replan_steps:
    value: 300
    status: calibrated
    test: "tests/test_executor.py::test_full_run_is_fast"
  reserve_warmup_share:
    value: 0.19
    status: calibrated
    test: "tests/test_executor.py::test_adaptive_beats_static_without_shock"
    note: "резерв включается после 19 % горизонта: 96 часов на кампании кейса в 21 день (там и калибровано); раньше опережение по KPI это шум первых дней, а не свойство мира; в семидневной кампании это 32 часа"
  card_min_interval_hours:
    value: 24
    status: sourced
    source_url: "https://developers.google.com/meridian/docs/user-guide/budget-optimization-scenarios"
    note: "информационная карточка о переносе по факту не чаще раза в сутки на канал, с накоплением суммы: доля канала меняется в суточном ритме (лимит ±30 % за сутки), человек не должен читать один и тот же перенос по частям; карточки о сломе и выше лимита полномочий выдаются сразу"
  reserve_step_share:
    value: 0.05
    status: calibrated
    test: "tests/test_executor.py::test_adaptive_beats_static_without_shock"
    note: "резерв меняется не более чем на 5 % остатка за перерешение, иначе темп колеблется (docs/decisions.md, запись 24)"
  pid_gains:
    value: [1.0, 0.02, 0.3]
    status: calibrated
    test: "tests/test_executor.py::test_baselines_complete_episode"
    note: "Kp, Ki, Kd для baseline PID; baseline, не наш метод"

metrics:
  mape_warmup_share:
    value: 0.05
    status: sourced
    source_url: "https://arxiv.org/abs/2503.06942"
    note: "MAPE нестабилен около нуля; первые 5 % часов исключаем, рядом считаем WAPE"
