# Наши допущения — всё, для чего публичного источника найти не удалось.
#
# Файл существует отдельно от benchmarks.yaml намеренно: в презентации и README
# эти значения нельзя выдавать за рыночные данные. Каждое допущение имеет
# обоснование и диапазон, внутри которого оно правдоподобно.

conversion_rate:
  note: |
    Публичных российских бенчмарков CR по каналам не нашли. Задаём как параметр
    мира в диапазоне, типичном для медийных и перформанс-размещений, и явно
    помечаем как допущение. На выводы кейса это не влияет: планировщик и
    симулятор используют CR симметрично, а метрика оценивается относительно плана.
  by_kind:
    social: {value: 0.012, range: [0.004, 0.030]}
    programmatic: {value: 0.008, range: [0.003, 0.020]}
    marketplace: {value: 0.040, range: [0.020, 0.080]}
    sms: {value: 0.025, range: [0.010, 0.050]}

marketplace_ctr:
  note: "CTR карточки в выдаче маркетплейса; источника не нашли, диапазон задан нами."
  by_channel:
    marketplace_cpc: {value: 0.020, range: [0.010, 0.040]}
    marketplace_cpm: {value: 0.008, range: [0.004, 0.020]}
    marketplace_premium: {value: 0.015, range: [0.008, 0.030]}

video_vtr:
  note: "VTR для видеоформатов; источника не нашли."
  by_channel:
    social_video: {value: 0.35, range: [0.20, 0.55]}

frequency_fatigue:
  note: |
    Падение CTR с ростом накопленной частоты: ctr(f) = ctr0 / (1 + delta * (f - 1)).
    Форма взята из практики частотного капирования (эффект убывающей отдачи
    повторных контактов), значение delta калибруется нами.
  delta: {value: 0.35, range: [0.15, 0.60]}

price_landscape:
  note: |
    Цена показа моделируется распределением выигрышной цены LogNormal(mu, sigma) —
    стандартный подход bid landscape forecasting в RTB (arXiv:2001.06587).
    sigma задаёт, насколько резко дорожает инвентарь при росте выкупа.
  sigma: {value: 0.45, range: [0.25, 0.80]}

hourly_demand:
  note: |
    Суточный профиль спроса: двугорбая кривая с утренним и вечерним пиками,
    выходные отличаются от будней. Форма — общее место медиапланирования,
    амплитуда калибруется нами и скрыта от планировщика.
  weekday_peak_ratio: {value: 1.8, range: [1.3, 2.5]}
  night_trough_ratio: {value: 0.35, range: [0.15, 0.55]}

noise:
  note: |
    Часовой шум автокоррелирован (AR(1)), а не белый: белый шум усредняется за
    сутки и любой контроллер выигрывает случайно. Автокорреляция создаёт полосы
    невезения, на которых и видна разница между стратегиями.
  ar1_rho: {value: 0.65, range: [0.3, 0.85]}
  ar1_sigma:
    value: 0.10
    range: [0.05, 0.35]
    status: calibrated
    test: "tests/test_executor.py::test_detector_silent_without_shock"
    note: |
      Калибровка 03.09: при σ = 0.18 дневная отдача канала на рубль колебалась
      на ±20–30 % без всякого шока, и никакой детектор не отличал шум от
      падения CTR на 40 %. При σ = 0.10 дневной разброс около 10 %, падение
      на 40 % отделимо от шума порогом 30 % (config/controller.yaml, detector).

catalog_bias:
  note: |
    Систематическое расхождение публичных бенчмарков с реальностью канала.
    Это причина, по которой план вообще расходится с фактом и по которой нужен
    сервис исполнения. Без смещения задача вырождается.
  scale: {value: 0.18, range: [0.05, 0.35]}

audience_scale:
  note: |
    Ключевое калибровочное решение. Медиаплан строится не на всю площадку, а на
    целевой сегмент внутри неё — так и работает реальное планирование. Поэтому
    дневная уникальная аудитория канала измеряется десятками тысяч, а не
    миллионами.

    Почему это важно: при бюджете 1,2 млн ₽ на 21 день дневной расход около
    57 000 ₽, что при типичном CPM даёт порядка 700 000 показов в день. Если
    ёмкость каналов на два порядка больше, она никогда не становится связывающим
    ограничением: кривые «бюджет → показы» вырождаются в прямые, распределение
    перестаёт зависеть от канала, а диагностика недостижимой цели теряет смысл.
    Масштаб сегмента подобран так, чтобы ёмкость была соразмерна кампании.
  daily_unique_audience_by_kind:
    social: {value: 70000, range: [30000, 150000]}
    programmatic: {value: 120000, range: [60000, 250000]}
    marketplace: {value: 25000, range: [10000, 50000]}
    sms: {value: 8000, range: [3000, 20000]}
  campaign_audience_multiplier:
    note: |
      во сколько раз охват за всю кампанию превышает дневную аудиторию.
      Калибровка: план демо 1 (1,2 млн ₽ / 21 день) должен выкупать около
      половины инвентаря при средней частоте 3–5 (tests/test_world_behaviour.py).
    value: 8.0
    range: [4.0, 12.0]

contacts_per_user_per_day:
  note: |
    Среднее число доступных рекламных контактов на одного уникального
    пользователя сегмента в сутки (κ в формуле инвентаря A = U · κ · w).
    Публичного источника нет; диапазон типичен для частотных лимитов площадок.
  by_family:
    auction: {value: 3.0, range: [1.5, 4.0]}
    marketplace: {value: 2.0, range: [1.0, 3.0]}
    direct: {value: 1.0, range: [1.0, 1.0]}

hidden_parameter_draw:
  note: |
    Истинные параметры эпизода выбираются внутри диапазонов публичного
    каталога «или рядом с ними» (контракт мира, §11). Насколько рядом:
    доля выхода за границу диапазона.
  outside_range_share: {value: 0.10, range: [0.0, 0.25]}

price_sigma_by_family:
  note: |
    Разброс цены инвентаря: у маркетплейсов инвентарь узкий и дорожает
    резче при выкупе (ставка премиальных позиций, аукцион за карточку).
  auction: {value: 0.45, range: [0.25, 0.80]}
  marketplace: {value: 0.70, range: [0.40, 1.00]}
