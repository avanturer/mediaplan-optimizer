# Реестр публичных бенчмарков.
#
# ПРАВИЛО ПРОЕКТА: ни одного числа из головы. У каждого значения есть либо
# source_url на публичный источник, либо status: calibrated и ссылка на тест
# или ноутбук, который это значение получил.
#
# Каналы в интерфейсе абстрактные. Российские площадки указаны только как
# происхождение диапазона (proxy_for) и никогда не показываются пользователю:
# кейс прямо запрещает выдавать модельные метрики за статистику конкретной сети.

meta:
  version: "0.1.0"
  currency: RUB
  statuses:
    sourced: "значение взято из публичного источника, ссылка обязательна"
    calibrated: "получено нашей калибровкой, ссылка на тест обязательна"
    needs_source: "заглушка, использовать в расчётах запрещено"

market_context:
  # Для слайда про масштаб боли, в расчётах не участвует.
