[project]
name = "mediaplan-optimizer"
version = "0.1.0"
description = "MediaPlan Optimizer: планировщик, симулятор рынка и сервис почасового исполнения (кейс МТС)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "import-linter>=2.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["contracts", "world", "brain", "brain.planner", "brain.executor", "harness", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.importlinter]
root_packages = ["contracts", "world", "brain", "harness", "app"]

[[tool.importlinter.contracts]]
name = "Мозг не видит мир: brain не импортирует world"
type = "forbidden"
source_modules = ["brain"]
forbidden_modules = ["world"]

[[tool.importlinter.contracts]]
name = "Контракты ни от кого не зависят"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["world", "brain", "app"]
